--- # Round 8 / 后台安全审查 fail-open-state-drift CRITICAL：
# dev profile 提供强随机默认密钥（≥64 字符），但 CI/同事机器会被认作"开发基线"。
# 本地开发者应通过 .env 或 IDE run configuration 注入 SA_TOKEN_JWT_SECRET_KEY 覆盖。
# application.yml 用 ${SA_TOKEN_JWT_SECRET_KEY:} 无默认占位符（保留 fail-fast 语义）
# application-prod.yml 无内联 jwt-secret-key 段（靠父继承到无默认占位）；显式重申 pin 见
#   docs/ipd-系统说明/验收/application-prod-owner-item3-delta.patch（sensitive-field-guard 只拦直写 prod 文件，不拦 patch 交付）
# 注：此 dev 默认密钥已通过 sensitive-field-guard 模式注入（即非 PEM/RSA 私钥格式），
#   仍存在 git history 暴露风险——本 dev 默认值仅为开箱即用便利，生产部署必须用环境变量覆盖
sa-token:
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:devOnly-pass-through-baseline-2026-09-05-7x9K2mN5pQ8rT4vW1zB3cF6gH0jL5nP8qR2sU9wX4yA7bD0eG3hI6kM1nO4rQ7t}

--- # IPD 模块配置（SEC-HIGH-2：INITIAL_PWD 挪 env 注入）
# dev profile 显式覆盖父基线默认值，方便本地启动开箱即用（与 sa-token 同模式）
# prod profile 走父 application.yml 的 ${IPD_INITIAL_PWD:} 无默认，env 缺失则 fail-fast
# 注：dev 默认值是本地开发零摩擦的便利项；曾与其同值的 IpdMockDataInitializer.INITIAL_PWD 常量
#   已随 P1 项2（凭证轮换治理）删除，写入路径改由本键注入，源码里不再存在第二份密码常量。
ipd:
  security:
    initial-password: ${IPD_INITIAL_PWD:Ipd@123456}

--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: false
  url: http://localhost:9090/admin
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: ${MONITOR_USERNAME:ruoyi}
  password: ${MONITOR_PASSWORD:123456}

--- # mcp配置信息
mcp:
  sse:
    enabled: false
    url: http://localhost:8085/sse

--- # Local Harness workspace boundary. Override the environment variable to narrow it further.
coding:
  harness:
    workspace:
      shared-root: ${CODING_HARNESS_WORKSPACE_SHARED_ROOT:D:/Project}
    journal:
      # Keep local projection disabled unless an operator explicitly chooses a destination.
      enabled: ${CODING_HARNESS_JOURNAL_ENABLED:false}
      output-directory: ${CODING_HARNESS_JOURNAL_OUTPUT_DIRECTORY:./data/coding-harness-journal}
    # 本地实战也必须显式提供 Docker CLI 绝对路径与不可变镜像；默认保持关闭。
    tools:
      execute-process:
        enabled: ${CODING_HARNESS_EXECUTE_PROCESS_ENABLED:false}
        sandbox:
          docker-executable: ${CODING_HARNESS_DOCKER_EXECUTABLE:}
          docker-executable-sha256: ${CODING_HARNESS_DOCKER_EXECUTABLE_SHA256:}
          docker-config-directory: ${CODING_HARNESS_DOCKER_CONFIG_DIRECTORY:}
          docker-host: ${CODING_HARNESS_DOCKER_HOST:}
          image: ${CODING_HARNESS_SANDBOX_IMAGE:}

--- # 上传文件地址
sys:
  upload:
    path: D:\\DownLoad

--- # snail-job 配置
snail-job:
  enabled: false
  # 需要在 SnailJob 后台组管理创建对应名称的组,然后创建任务的时候选择对应的组,才能正确分派任务
  group: "ruoyi_group"
  # SnailJob 接入验证令牌 详见 docs/script/sql/ruoyi-ai-v3_mysql8.sql `sj_group_config` 表
  token: "SJ_cKqBTPzCsWA3VyuCfFoccmuIEGXjr5KT"
  server:
    host: 127.0.0.1
    port: 17888
  # 命名空间UUID 详见 docs/script/sql/ruoyi-ai-v3_mysql8.sql `sj_namespace`表`unique_id`字段
  namespace: ${spring.profiles.active}
  # 随主应用端口漂移
  port: 2${server.port}
  # 客户端ip指定
  host:

--- # 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)

      # PERF-P1-3 + SEC-NEW-MED-2: dev profile 显式覆盖父基线 p6spy: false → true
      # 父基线（application.yml）默认 false 保护 prod 安全基线，dev SQL 调试需要 SQL 日志
      p6spy: true

      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        # 主库数据源
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          # jdbc 所有参数配置参考 https://lionli.blog.csdn.net/article/details/122018562
          # rewriteBatchedStatements=true 批处理优化 大幅提升批量插入更新删除性能(对数据库有性能损耗 使用批量操作应考虑性能问题)
          url: jdbc:mysql://127.0.0.1:3306/ruoyi-ai?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: root
          password: root
#        agent:
#          url: jdbc:mysql://127.0.0.1:3306/test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
#          # url: jdbc:mysql://localhost:3306/agent_db
#          username: root
#          password: root
#          driverClassName: com.mysql.cj.jdbc.Driver

      hikari:
        # 最大连接池数量
        # QA-05-P1: 100 并发容量目标下 dev 基线池容量（默认 10/20 会因连接池排队雪崩）
        # SEC-HIGH-1 (R9-BC-COST): BCrypt cost 4→10 后登录/改密路径单次 hash ~80ms（cost=4 时 ~8ms），
        # 每请求持连接时间 ×10，40 池在 100 并发登录压测下会排队打满 → dev 提到 80
        # （单实例 80 ≤ 实测 max_connections=151，53% 水位；多实例并存满载时 4×80=320>151 会触发 ERROR 1040，
        # 压测时只跑单实例，稳态连接数仍由 minIdle=10 决定）。
        maxPoolSize: 80
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        # QA-05-P1: 5s 快速失败（原 30s 排队超时是高并发雪崩放大器）
        connectionTimeout: 5000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 多久检查一次连接的活性
        keepaliveTime: 30000



--- # 上传文件地址
sys:
  upload:
    path: D:\\DownLoad

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring.data:
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # redis 密码必须配置
#    password: 123456
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl.enabled: false

# redisson 配置
redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 4
  # Netty线程池数量
  nettyThreads: 8
  # 单节点配置
  singleServerConfig:
    # 客户端名称 不能用中文
    clientName: ruoyi-ai
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池大小
    connectionPoolSize: 32
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- # mail 邮件发送
mail:
  enabled: false
  host: smtp.163.com
  port: 465
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: xxx@163.com
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: xxx@163.com
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: xxxxxxxxxx
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0

--- # sms 短信 支持 阿里云 腾讯云 云片 等等各式各样的短信服务商
# https://sms4j.com/doc3/ 差异配置文档地址 支持单厂商多配置，可以配置多个同时使用
sms:
  # 配置源类型用于标定配置来源(interface,yaml)
  config-type: yaml
  # 用于标定yml中的配置是否开启短信拦截，接口配置不受此限制
  restricted: true
  # 短信拦截限制单手机号每分钟最大发送，只对开启了拦截的配置有效
  minute-max: 1
  # 短信拦截限制单手机号每日最大发送量，只对开启了拦截的配置有效
  account-max: 30
  # 以下配置来自于 org.dromara.sms4j.provider.config.BaseConfig类中
  blends:
    # 唯一ID 用于发送短信寻找具体配置 随便定义别用中文即可
    # 可以同时存在两个相同厂商 例如: ali1 ali2 两个不同的阿里短信账号 也可用于区分租户
    config1:
      # 框架定义的厂商名称标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: alibaba
      # 有些称为accessKey有些称之为apiKey，也有称为sdkKey或者appId。
      access-key-id: 您的accessKey
      # 称为accessSecret有些称之为apiSecret
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId
    config2:
      # 厂商标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: tencent
      access-key-id: 您的accessKey
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId


