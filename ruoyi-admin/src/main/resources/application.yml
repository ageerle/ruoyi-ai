# 开发环境配置
server:
  # 服务器的HTTP端口，默认为6039
  port: 6039
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: -1
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

# Harness 命令仍受工作区租约、执行计划和工具审批约束；开启后才能验证并运行生成的网站。
coding:
  harness:
    budget:
      # 模型回合上限；工具额度按每回合最多 3 次保持同比例，避免工具预算先于回合耗尽。
      max-iterations: 200
      max-tool-calls: 600
    tools:
      execute-process:
        enabled: true

--- # 小程序对话 WebSocket 兜底默认模型（前端未传 model 且无智能体绑定时使用）
chat:
  default-model: deepseek-v4-flash

captcha:
  # 是否启用验证码校验
  enable: false
  # 验证码类型 math 数组计算 char 字符验证
  type: MATH
  # line 线段干扰 circle 圆圈干扰 shear 扭曲干扰
  category: CIRCLE
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 日志配置
logging:
  level:
    org.ruoyi: ${LOGGING_LEVEL_ORG_RUOYI:info}
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
  config: classpath:logback-plus.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: ruoyi-ai
  # ⚠️ 禁用 Spring Boot 的 Neo4j 自动配置
  # 默认情况下，如果类路径上存在 neo4j-java-driver，Spring Boot 会尝试自动配置
  # 这会导致应用在启动时尝试连接到 Neo4j，即使我们没有需要它
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: false
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false
  # 数据源连接池默认参数（QA-05-P1）
  # 本项目数据源由 baomidou dynamic-datasource 创建，池参数生效路径是
  # spring.datasource.dynamic.hikari.*（Spring Boot 原生 spring.datasource.hikari.* 不生效）。
  # 此处为未显式配池的 profile（如 ipd-local）提供安全基线：
  # 缺省时 HikariCP 默认 maximumPoolSize=10 + connectionTimeout=30s，并发>10 即排队雪崩。
  # application-dev.yml / application-prod.yml 以同名键覆盖（prod 维持 maxPoolSize=20 现值）。
  datasource:
    dynamic:
      # 性能分析插件（有性能损耗 不建议生产环境使用）
      # PERF-P1-3 + SEC-NEW-MED-2: 父基线显式 false，所有 profile 默认走安全基线
      # dev profile 需在 application-dev.yml 显式覆盖为 true（本地 SQL 调试用）
      # prod profile 必须在 application-prod.yml 显式保持 false 或留空走本基线（hook 阻断由用户手动合并）
      p6spy: false
      hikari:
        # 最大连接池数量
        # QA-05-P1 P1-1（U0）连接预算约束：基座值必须满足「在跑实例数 × maxPoolSize ≤ max_connections」。
        # 实测 max_connections=151，本仓常态 4 实例并存（16039/16044/16045/16050）；
        # 锚点等式 4 × HikariCP 默认 10 = 40 ≡ processlist 中 ipd_app 的 40 个连接（且全为 Sleep 空闲态）
        # → 常驻连接数由池预留决定、与业务负载无关（零负载也占满），故可据此确定性外推。
        # 基座取 20（与 prod 现值一致）：4 × 20 = 80，53% 水位，留 71 个连接给压测/运维实例。
        # 若取 40：4 × 40 = 160 > 151 → ERROR 1040 Too many connections，比池排队雪崩更严重
        # （新实例根本起不来、运行中实例取不到连接，且 ipd_app 非 SUPER 拿不到 MySQL 保留连接）。
        # dev 单实例压测若需更大池，请在 application-dev.yml 显式覆盖（dev 现为 40，勿再上调基座）。
        maxPoolSize: 20
        # 最小空闲连接数量
        minIdle: 10
        # 配置获取连接等待超时的时间：5s 快速失败，避免高并发下 30s 排队雪崩
        connectionTimeout: 5000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 多久检查一次连接的活性
        keepaliveTime: 30000

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # jwt秘钥
  # 注意：application.yml 不再含任何默认密钥；所有 profile 必须通过 SA_TOKEN_JWT_SECRET_KEY 环境变量注入
  # application-dev.yml 提供 dev profile 默认值（仅供本地启动）
  # application-prod.yml 加 jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:}（无默认）覆盖（待 sensitive-field-guard hook 解除后由用户/CI 手动合并）
  # R8 后台安全审查 credentials-exposure：原 commit a8a70ad9 把密钥明文写入 application.yml 历史已可见，需视为泄露并轮换
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:}

# IPD 模块配置（SEC-HIGH-2：INITIAL_PWD 挪 env 注入）
ipd:
  security:
    # Mock 初始化器（IpdMockDataInitializer）种子的初始密码来源
    # 父基线无默认：prod profile 必须在 application-prod.yml 或环境变量 IPD_INITIAL_PWD 显式注入，缺失则 fail-fast
    # dev profile 在 application-dev.yml 显式覆盖默认值方便本地启动
    initial-password: ${IPD_INITIAL_PWD:}

# security配置
security:
  # 排除路径
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    - /*/api-docs
    - /*/api-docs/**
    - /warm-flow-ui/config
    - /workflow/run
    # IPD 独立认证体系（StpLogic "ipd"）——/api/v1/** 鉴权由 IpdPermission 自管，不走基线 sys_user 会话
    - /api/v1/**
# 多租户配置
tenant:
  # 是否开启
  enable: true
  # 排除表
  excludes:
    - sys_menu
    - sys_tenant
    - sys_tenant_package
    - sys_role_dept
    - sys_role_menu
    - sys_user_post
    - sys_user_role
    - sys_client
    - sys_oss_config
    - flow_spel
    # 链路追踪监控表：运维需跨租户全局查看，且 trace_node 在异步线程写入、租户上下文不传播，故排除租户过滤
    - trace_run
    - trace_node
    # IPD 单企业私有部署：26+2 张业务表统一排除租户过滤（表结构带 tenant_id 默认 000000，无多租户语义）
    # 26 张基线表 + 2 张 Round 8 新增表（launch_date_change_requests / project_cert_items）
    - persons
    - product_groups
    - products
    - projects
    - project_members
    - project_stages
    - stage_actions
    - deliverables
    - sop_templates
    - gate_review_elements
    - gate_element_results
    - cert_templates
    - gates
    - gate_reviews
    - requirements
    - requirement_changes
    - bid_invitations
    - bid_responses
    - deletion_requests
    - handover_records
    # Round 8 / R8-P0-1：补充 DDL 新增业务表
    - bonus_allocations
    - project_scores
    - contributions
    - negative_feedbacks
    - requirement_pool
    - ai_model_configs
    - system_config_versions
    - legacy_imports
    - receipt_ledger
    - audit_logs
    - kpi_records
    - allowance_ledgers
    - bonus_pools
    - ai_documents
    - system_configs
    # Round 8 新增（与上方基线表统一排除租户过滤）
    - launch_date_change_requests
    - project_cert_items

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 自定义配置 是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enableLogicDelete: true
  # 多包名使用 例如 org.ruoyi.**.mapper,org.xxx.**.mapper
  mapperPackage: org.ruoyi.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: org.ruoyi.**.domain
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: false
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# api接口加密
api-decrypt:
  # 是否开启全局接口加密
  enabled: false
  # AES 加密头标识
  headerFlag: encrypt-key
  # 响应加密公钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端解密私钥（PEM 字面量已移除以避免 git 历史长期暴露——SEC-NEW-MED-4 Round 9）。
  # 真值必须通过 ${API_DECRYPT_PRIVATE_KEY} 环境变量注入（见下方 privateKey 行）；
  # 留空时即便 enabled=true 也会因空私钥启动失败（fail-fast 语义）。
  publicKey: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAJnNwrj4hi/y3CCJu868ghCG5dUj8wZK++RNlTLcXoMmdZWEQ/u02RgD5LyLAXGjLOjbMtC+/J9qofpSGTKSx/MCAwEAAQ==
  # 请求解密私钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端加密公钥 通过环境变量 API_DECRYPT_PRIVATE_KEY 注入；留空时即便 enabled=true 也会因空私钥启动失败
  privateKey: ${API_DECRYPT_PRIVATE_KEY:}

springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: true
  info:
    # 标题
    title: '标题：ruoyi-ai管理系统_接口文档'
    # 描述
    description: '描述：用于管理集团旗下公司的人员信息,具体包括XXX,XXX模块...'
    # 版本
    version: '版本号: ${project.version}'
    # 作者信息
    contact:
      name:  ageerle
      email: ageerle@163.com
      url: https://gitee.com/ageerle/ruoyi-ai

  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 1.演示模块
      packages-to-scan: org.ruoyi.demo
    - group: 2.通用模块
      packages-to-scan: org.ruoyi.web
    - group: 3.系统模块
      packages-to-scan: org.ruoyi.system
    - group: 4.代码生成模块
      packages-to-scan: org.ruoyi.generator
    - group: 5.工作流模块
      packages-to-scan: org.ruoyi.workflow
    - group: 6.MCP模块
      packages-to-scan: org.ruoyi.mcp

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  excludeUrls:
    - /system/notice

--- # 链路追踪配置
trace:
  # 是否启用链路追踪，默认 true
  # 关闭后所有埋点代码会直接透传业务逻辑，不写库、不创建上下文，零性能开销
  enabled: true
  payload:
    # 错误信息最大字符长度（格式: "异常类名: 异常消息"），超过部分会被截断丢弃
    max-error-length: 1000

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # Actuator 监控端点的配置项
# SEC-NEW-MED-1: 父基线显式收窄到 health,info,metrics（避免暴露 env/heapdump/shutdown/threaddump 等敏感端点）
# dev profile 在 application-dev.yml 显式覆盖 include: '*'（本地调试便利）
# prod profile 必须保持父基线或显式收窄（hook 阻断由用户手动合并）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # SEC-NEW-MED-1: show-details 从 ALWAYS 改 WHEN_AUTHORIZED（未授权用户只看到 UP/DOWN 状态，不暴露 DB/磁盘详情）
      show-details: WHEN_AUTHORIZED
    logfile:
      external-file: ./logs/sys-console.log

--- # 默认/推荐使用sse推送
sse:
  enabled: true
  path: /resource/sse

--- # websocket
websocket:
  # 如果关闭 需要和前端开关一起关闭
  enabled: false
  # 路径
  path: /resource/websocket
  # 设置访问源地址
  allowedOrigins: '*'

--- # 演示模式配置
demo:
  # 是否开启演示模式（开启后所有写操作将被拦截）
  # R8-P0-2：默认关闭，避免误开启阻断全部 IPD 写操作；dev profile 如需演示模式请在 application-dev.yml 显式覆盖
  enabled: false
  # 提示消息
  message: "演示模式，不允许操作"
  # 排除的路径（这些路径不受演示模式限制）
  excludes:
    - /login
    - /logout
    - /register
    - /captcha/**
    - /auth/**
    - /chat/send
    - /system/session/**
    - /system/message/**
    - /system/attach/**
    - /system/fragment/**
    - /system/info/**
    # IPD 独立认证体系（与 security.excludes 对齐）：默认 dev profile 演示模式放行 IPD 写操作
    - /api/v1/**
--- # warm-flow工作流配置
warm-flow:
  # 是否开启工作流，默认true
  enabled: true
  # 是否开启设计器ui
  ui: true
  # 是否显示流程图顶部文字
  top-text-show: true
  # 是否渲染节点悬浮提示，默认true
  node-tooltip: true
  # 默认Authorization，如果有多个token，用逗号分隔
  token-name: ${sa-token.token-name},clientid

# 向量库配置
vector-store:
  # 向量存储类型 可选(weaviate/milvus/qdrant)
  # 如需修改向量库类型，请修改此配置值!
  # 注意：需与 docker-compose 实际部署的向量库保持一致（当前 compose 内置 weaviate，映射端口 28080）
  type: weaviate
  # Weaviate配置
  weaviate:
    protocol: http
    host: 127.0.0.1:28080
    classname: LocalKnowledge
  # Milvus配置
  milvus:
    url: http://localhost:19530
    collectionname: LocalKnowledge
  # Qdrant配置
  qdrant:
    host: localhost
    port: 6334
    collectionname: LocalKnowledge
    api-key:
    use-tls: false

# 流程编排扩展节点
workflow:
  web-search:
    zhipu:
      # 推荐通过环境变量注入；为空时回退到模型管理中的 zhipu 厂商密钥
      api-key: ${ZAI_API_KEY:}
      base-url: ${ZHIPU_WEB_SEARCH_BASE_URL:https://open.bigmodel.cn/api/paas/v4/}
      connect-timeout: ${ZHIPU_WEB_SEARCH_CONNECT_TIMEOUT:10}
      read-timeout: ${ZHIPU_WEB_SEARCH_READ_TIMEOUT:30}

# 短剧成片合成
short-drama:
  composition:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    fps: ${SHORT_DRAMA_COMPOSITION_FPS:30}
    audio-sample-rate: ${SHORT_DRAMA_COMPOSITION_AUDIO_SAMPLE_RATE:48000}
    video-codec: ${SHORT_DRAMA_COMPOSITION_VIDEO_CODEC:libx264}
    audio-codec: ${SHORT_DRAMA_COMPOSITION_AUDIO_CODEC:aac}
    preset: ${SHORT_DRAMA_COMPOSITION_PRESET:medium}
    crf: ${SHORT_DRAMA_COMPOSITION_CRF:20}
    audio-bitrate: ${SHORT_DRAMA_COMPOSITION_AUDIO_BITRATE:192k}
    max-clips: ${SHORT_DRAMA_COMPOSITION_MAX_CLIPS:100}
    max-transition-seconds: ${SHORT_DRAMA_COMPOSITION_MAX_TRANSITION_SECONDS:2.0}
    minimum-output-bytes: ${SHORT_DRAMA_COMPOSITION_MINIMUM_OUTPUT_BYTES:1024}
    max-process-output-bytes: ${SHORT_DRAMA_COMPOSITION_MAX_PROCESS_OUTPUT_BYTES:1048576}
    max-source-bytes: ${SHORT_DRAMA_COMPOSITION_MAX_SOURCE_BYTES:536870912}
    max-total-source-bytes: ${SHORT_DRAMA_COMPOSITION_MAX_TOTAL_SOURCE_BYTES:2147483648}
    probe-timeout: ${SHORT_DRAMA_COMPOSITION_PROBE_TIMEOUT:30s}
    process-timeout: ${SHORT_DRAMA_COMPOSITION_PROCESS_TIMEOUT:30m}
    job-stale-after: ${SHORT_DRAMA_COMPOSITION_JOB_STALE_AFTER:45m}
    watermark-font-file: ${SHORT_DRAMA_COMPOSITION_WATERMARK_FONT_FILE:}
    worker-core-size: ${SHORT_DRAMA_COMPOSITION_WORKER_CORE_SIZE:1}
    worker-max-size: ${SHORT_DRAMA_COMPOSITION_WORKER_MAX_SIZE:2}
    worker-queue-capacity: ${SHORT_DRAMA_COMPOSITION_WORKER_QUEUE_CAPACITY:8}
    storage-mode: ${SHORT_DRAMA_COMPOSITION_STORAGE_MODE:local}
    local-output-directory: ${SHORT_DRAMA_COMPOSITION_LOCAL_OUTPUT_DIRECTORY:logs/short-drama-compositions}
    download:
      connect-timeout: ${SHORT_DRAMA_DOWNLOAD_CONNECT_TIMEOUT:30s}
      call-timeout: ${SHORT_DRAMA_DOWNLOAD_CALL_TIMEOUT:10m}
      max-redirects: ${SHORT_DRAMA_DOWNLOAD_MAX_REDIRECTS:5}
      # 生产环境建议配置为视频供应商或 OSS/CDN 域名，多个值用逗号分隔。
      allowed-hosts: ${SHORT_DRAMA_DOWNLOAD_ALLOWED_HOSTS:}
      fake-ip-allowed-hosts: ${SHORT_DRAMA_DOWNLOAD_FAKE_IP_ALLOWED_HOSTS:atlas-media.oss-us-west-1.aliyuncs.com}
